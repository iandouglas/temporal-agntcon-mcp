[project]
name = "durable-mcp"
version = "0.1.0"
description = "Remote MCP server that executes every tool call as a durable Temporal workflow"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.1.1,<3",
    "temporalio>=1.32.0,<2",
    "redis>=5.2",
    "httpx>=0.28",
    "starlette>=0.47",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/durable_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
